<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | LogSense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar-wrap">
    <div class="container">
      <nav class="navbar-shell">
        <a class="brand-mark" href="index.html" aria-label="LogSense home">
          <img src="assets/logo.svg" class="brand-logo" alt="LogSense logo">
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="docs.html">Docs</a>
          <a href="downloads.html">Downloads</a>
          <a href="blog.html">Blog</a>
          <a href="faqs.html">FAQs</a>
          <a href="contactus.html" class="active">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero reveal">
      <div class="container">
        <h1>Contact <span class="hero-glow">LogSense</span></h1>
        <p>Share bug reports, feedback, and feature requests. We use your input to improve every release.</p>
      </div>
    </section>

    <section class="section reveal">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-8">
            <form id="contact-form" class="glass-card">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label muted" for="name">Name</label>
                  <input id="name" class="form-control" type="text" placeholder="Your name" required>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label muted" for="email">Email</label>
                  <input id="email" class="form-control" type="email" placeholder="you@example.com" required>
                </div>
                <div class="col-12">
                  <label class="form-label muted" for="topic">Topic</label>
                  <select id="topic" class="form-select" required>
                    <option value="" selected disabled>Select a topic</option>
                    <option>Bug Report</option>
                    <option>Feature Request</option>
                    <option>Integration Help</option>
                    <option>General Feedback</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label muted" for="message">Message</label>
                  <textarea id="message" class="form-control" rows="6" placeholder="Include what you ran, what happened, and what you expected." required></textarea>
                </div>
                <div class="col-12 d-flex flex-wrap gap-3 align-items-center">
                  <button class="btn-primary-glow" type="submit"><i class="bi bi-send"></i> Send Message</button>
                  <span class="muted" id="contact-status"></span>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer-wrap">
    <div class="container">
      <a class="footer-brand" href="index.html" aria-label="LogSense home">
        <img src="assets/logo.svg" class="footer-logo" alt="LogSense logo">
      </a>
      <p class="mb-1">AI-Powered Log Analysis</p>
      <p class="mb-0">LogSense &copy; 2026. Understand Your Logs Instantly.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="scripts.js"></script>
</body>
</html>
